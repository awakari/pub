apiVersion: v1
kind: Service
metadata:
  name: {{ include "pub.fullname" . }}
  labels:
    {{- include "pub.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "{{ .Values.service.port.metrics }}"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port.http }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.port.metrics }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "pub.selectorLabels" . | nindent 4 }}
